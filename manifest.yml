modules:
  jira:issuePanel:
    - key: due-date-check-hello-world-panel
      resource: main
      resolver:
        function: resolver
      viewportSize: medium
      title: Due Date Check
      icon: https://developer.atlassian.com/platform/forge/images/issue-panel-icon.svg
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: static/hello-world/build
permissions:
  scopes:
    - read:jira-work
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/7f64329c-e863-479e-88aa-19b4537a9014
